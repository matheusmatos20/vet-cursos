<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chamada | Clinvet Cursos</title><link rel="stylesheet" href="styles.css"><style>
.call-wrap{max-width:980px;margin:28px auto}.filters{display:grid;grid-template-columns:1fr 1fr 1.3fr auto;gap:12px;align-items:end}.statuspick{display:flex;gap:8px;flex-wrap:wrap}.statuspick label{border:1px solid #d5dde5;padding:7px 10px;border-radius:9px;cursor:pointer}.obs{min-width:180px}@media(max-width:760px){.filters{grid-template-columns:1fr}}</style></head><body><header><div class="brand"><span class="paw">🐾</span><div><h1>Clinvet • Chamada</h1><small>Frequência das aulas</small></div></div><a href="coordenador.html" class="btn secondary">← Coordenação</a></header><main class="wrap call-wrap"><section class="card"><h2>Registrar presença da turma</h2><div class="filters"><label>Turma<select id="turma"><option value="">Selecione...</option></select></label><label>Data<input id="dataAula" type="date"></label><label>Aula / conteúdo<input id="aula" placeholder="Ex.: Biossegurança"></label><button class="btn secondary" id="carregar">Carregar alunos</button></div></section><section id="listaCard" class="card hidden"><div class="calendar-head"><div><h2 id="titulo">Chamada</h2><small id="sub"></small></div><button class="btn success" id="salvar">Salvar chamada</button></div><div style="overflow:auto"><table><thead><tr><th>Aluno</th><th>Matrícula</th><th>Status</th><th>Observação</th></tr></thead><tbody id="body"></tbody></table></div><div id="msg"></div></section></main><script src="app.js"></script><script>
dataAula.value=ymd(new Date());let alunos=[];
async function init(){let ts=DEMO?['Auxiliar Vet • 2026.2']:await api('frequenciaTurmas');turma.innerHTML='<option value="">Selecione...</option>'+ts.map(t=>`<option>${esc(t)}</option>`).join('')}init();
async function load(){if(!turma.value||!dataAula.value||!aula.value.trim()){alert('Selecione turma, data e informe a aula.');return}if(DEMO)alunos=[{matricula:'20260001',nome:'Ana Oliveira',status:'PRESENTE',observacao:''},{matricula:'20260002',nome:'Bruno Santos',status:'PRESENTE',observacao:''},{matricula:'20260003',nome:'Carolina Lima',status:'PRESENTE',observacao:''}];else alunos=await api('chamadaCarregar',{turma:turma.value,data:dataAula.value,aula:aula.value.trim()});body.innerHTML=alunos.map((x,i)=>`<tr><td><b>${esc(x.nome)}</b></td><td>${esc(x.matricula)}</td><td><div class="statuspick"><label><input type="radio" name="s${i}" value="PRESENTE" ${x.status==='PRESENTE'?'checked':''}> Presente</label><label><input type="radio" name="s${i}" value="FALTA" ${x.status==='FALTA'?'checked':''}> Falta</label><label><input type="radio" name="s${i}" value="JUSTIFICADA" ${x.status==='JUSTIFICADA'?'checked':''}> Justificada</label></div></td><td><input class="obs" data-obs="${i}" value="${esc(x.observacao||'')}" placeholder="Opcional"></td></tr>`).join('')||'<tr><td colspan="4">Nenhum aluno nesta turma.</td></tr>';titulo.textContent=aula.value.trim();sub.textContent=turma.value+' • '+new Date(dataAula.value+'T12:00').toLocaleDateString('pt-BR');listaCard.classList.remove('hidden');msg.textContent=''}
carregar.onclick=load;
salvar.onclick=async()=>{const itens=alunos.map((x,i)=>({matricula:x.matricula,status:document.querySelector(`input[name=s${i}]:checked`)?.value||'PRESENTE',observacao:document.querySelector(`[data-obs="${i}"]`)?.value||''}));try{if(!DEMO)await api('chamadaSalvar',{turma:turma.value,data:dataAula.value,aula:aula.value.trim(),itens});msg.innerHTML='<p style="color:#176b3a"><b>✓ Chamada salva com sucesso.</b></p>'}catch(e){msg.innerHTML='<p style="color:#8a1f1f">'+esc(e.message)+'</p>'}};
</script></body></html>
