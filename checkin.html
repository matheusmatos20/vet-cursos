<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Check-in de Estágio | Clinvet</title><link rel="stylesheet" href="styles.css"><style>
body{background:#f4f7fa}.checkin{max-width:560px;margin:70px auto}.hero{background:linear-gradient(135deg,#073b63,#0b6f94);color:#fff;text-align:center}.formgrid{display:grid;gap:14px}.result{display:none;margin-top:16px;padding:18px;border-radius:12px}.ok{background:#eaf8ef;color:#176b3a}.err{background:#fdecec;color:#8a1f1f}.big{font-size:2rem;font-weight:800}</style></head><body><main class="wrap checkin"><section class="card hero"><div class="big">🐾 Check-in de Estágio</div><p>Informe sua matrícula e senha para registrar sua presença no estágio atual.</p></section><section class="card"><div class="formgrid"><label>Matrícula<input id="matricula" autocomplete="username" placeholder="Sua matrícula"></label><label>Senha<input id="senha" type="password" autocomplete="current-password" placeholder="Sua senha"></label><button class="btn success" id="entrar">Registrar check-in</button></div><div id="resultado" class="result"></div></section></main><script src="app.js"></script><script>
entrar.onclick=async()=>{resultado.style.display='none';if(!matricula.value.trim()||!senha.value){alert('Informe matrícula e senha.');return}entrar.disabled=true;entrar.textContent='Registrando...';try{let d;if(DEMO)d={nome:'Aluno Demonstração',especialidade:'Clínica',turno:'Manhã 08h–13h',checkInEm:new Date(),jaRealizado:false};else d=(await request({acao:'checkinEstagio',matricula:matricula.value.trim(),senha:senha.value})).data;resultado.className='result ok';resultado.innerHTML=`<b>✓ Check-in ${d.jaRealizado?'já registrado':'realizado com sucesso'}!</b><br><br><strong>${esc(d.nome)}</strong><br>${esc(d.especialidade)} • ${esc(d.turno)}<br><small>${new Date(d.checkInEm).toLocaleString('pt-BR')}</small>`;resultado.style.display='block';senha.value=''}catch(e){resultado.className='result err';resultado.textContent=e.message;resultado.style.display='block'}finally{entrar.disabled=false;entrar.textContent='Registrar check-in'}};</script></body></html>
