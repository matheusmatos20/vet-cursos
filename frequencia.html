<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frequência | Coordenação Clinvet</title><link rel="stylesheet" href="styles.css"><style>
.freq-wrap{max-width:1100px;margin:28px auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.metric{padding:14px;background:#f6f9fb;border-radius:12px}.metric b{font-size:1.5rem}.clickrow{cursor:pointer}.clickrow:hover{background:#f3f8fc}.detail{margin-top:18px}</style></head><body><header><div class="brand"><span class="paw">🐾</span><div><h1>Clinvet • Frequência</h1><small>Aulas e estágios</small></div></div><a href="coordenador.html" class="btn secondary">← Coordenação</a></header><main class="wrap freq-wrap"><section class="card"><div class="calendar-head"><div><h2>Frequência por turma</h2><small>Clique em um aluno para ver o histórico individual.</small></div><select id="turma"><option value="">Selecione a turma...</option></select></div><div style="overflow:auto"><table><thead><tr><th>Aluno</th><th>Aulas</th><th>Faltas</th><th>Horas de estágio</th><th>Progresso estágio</th></tr></thead><tbody id="body"></tbody></table></div></section><section id="detail" class="card hidden detail"><div class="calendar-head"><div><h2 id="nomeAluno"></h2><small id="metaAluno"></small></div><button class="btn secondary" onclick="detail.classList.add('hidden')">Fechar</button></div><div id="resumo" class="cards"></div><h3>Aulas</h3><div style="overflow:auto"><table><thead><tr><th>Data</th><th>Aula</th><th>Status</th><th>Observação</th></tr></thead><tbody id="aulasBody"></tbody></table></div><h3 style="margin-top:20px">Horas de estágio realizadas</h3><div style="overflow:auto"><table><thead><tr><th>Data</th><th>Especialidade</th><th>Turno</th><th>Horas contabilizadas</th></tr></thead><tbody id="estBody"></tbody></table></div></section></main><script src="app.js"></script><script>
let dados=[];
async function init(){let ts=DEMO?['Auxiliar Vet • 2026.2']:await api('frequenciaTurmas');turma.innerHTML='<option value="">Selecione a turma...</option>'+ts.map(t=>`<option>${esc(t)}</option>`).join('')}init();
turma.onchange=load;
async function load(){if(!turma.value){body.innerHTML='';return}if(DEMO)dados=[{matricula:'20260001',nome:'Ana Oliveira',aulas:{percentual:92,faltas:1,total:12,presentes:10},estagios:{horas:65,minimo:90,maximo:120,percentual:72,horasRestantesMinimo:25,minimoConcluido:false}},{matricula:'20260002',nome:'Bruno Santos',aulas:{percentual:100,faltas:0,total:12,presentes:12},estagios:{horas:95,minimo:90,maximo:120,percentual:100,horasRestantesMinimo:0,minimoConcluido:true}}];else dados=await api('frequenciaTurma',{turma:turma.value});body.innerHTML=dados.map(x=>`<tr class="clickrow" onclick="openAluno('${x.matricula}')"><td><b>${esc(x.nome)}</b><br><small>${esc(x.matricula)}</small></td><td><b>${x.aulas.percentual}%</b><br><small>${x.aulas.presentes}/${x.aulas.total}</small></td><td>${x.aulas.faltas}</td><td><b>${x.estagios.horas}h</b><br><small>mín. 90h • máx. 120h</small></td><td><b>${x.estagios.percentual}%</b><br><small>${x.estagios.minimoConcluido?'mínimo concluído':'faltam '+x.estagios.horasRestantesMinimo+'h'}</small></td></tr>`).join('')||'<tr><td colspan="5">Nenhum aluno.</td></tr>'}
async function openAluno(mat){let f;if(DEMO)f={aluno:{nome:'Ana Oliveira',matricula:mat,turma:turma.value},aulas:{total:12,presentes:10,faltas:1,justificadas:1,percentual:92},estagios:{horas:65,minimo:90,maximo:120,percentual:72,horasRestantesMinimo:25,horasDisponiveisMaximo:55,minimoConcluido:false,maximoAtingido:false},aulasRegistros:[{data:'2026-09-28',aula:'Biossegurança',status:'PRESENTE',observacao:''}],estagiosRegistros:[{data:'2026-09-29',especialidade:'Clínica',turno:'Manhã 08h–13h',horas:5}]};else f=await api('frequenciaAluno',{matricula:mat});nomeAluno.textContent=f.aluno.nome;metaAluno.textContent=f.aluno.matricula+' • '+f.aluno.turma;resumo.innerHTML=`<div class="metric"><small>Frequência aulas</small><br><b>${f.aulas.percentual}%</b></div><div class="metric"><small>Faltas em aula</small><br><b>${f.aulas.faltas}</b></div><div class="metric"><small>Horas de estágio</small><br><b>${f.estagios.horas}h</b><br><small>mín. 90h • máx. 120h</small></div><div class="metric"><small>Progresso para o mínimo</small><br><b>${f.estagios.percentual}%</b><br><small>${f.estagios.minimoConcluido?'mínimo concluído':'faltam '+f.estagios.horasRestantesMinimo+'h'}</small></div>`;aulasBody.innerHTML=(f.aulasRegistros||[]).map(x=>`<tr><td>${new Date(x.data+'T12:00').toLocaleDateString('pt-BR')}</td><td>${esc(x.aula)}</td><td>${esc(x.status)}</td><td>${esc(x.observacao||'—')}</td></tr>`).join('')||'<tr><td colspan="4">Sem registros.</td></tr>';estBody.innerHTML=(f.estagiosRegistros||[]).map(x=>`<tr><td>${new Date(x.data+'T12:00').toLocaleDateString('pt-BR')}</td><td>${esc(x.especialidade)}</td><td>${esc(x.turno)}</td><td><b>${x.horas||0}h</b></td></tr>`).join('')||'<tr><td colspan="4">Nenhuma hora registrada.</td></tr>';detail.classList.remove('hidden');detail.scrollIntoView({behavior:'smooth'})}
</script></body></html>
