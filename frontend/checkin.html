<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Check-in e Check-out | Clinvet</title><link rel="stylesheet" href="shared/styles.css"><link rel="stylesheet" href="checkin.css"></head><body>
<main class="wrap kiosk"><section class="card hero"><div class="big">🐾 Aulas Práticas</div><p>Terminal do hospital para registrar entrada e saída.</p></section><section class="card"><div class="formgrid"><label>Matrícula<input id="matricula" autocomplete="username" placeholder="Sua matrícula"></label><label>Senha<input id="senha" type="password" autocomplete="current-password" placeholder="Sua senha"></label><div class="actions-kiosk"><button class="btn success" id="checkin">Registrar check-in</button><button class="btn checkout" id="checkout">Registrar check-out</button></div></div><div id="resultado" class="result"></div></section></main>
<script src="shared/app.js"></script><script src="checkin.js"></script></body></html>
